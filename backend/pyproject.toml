[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["*/migrations/*"]
force-exclude = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",      # docstrings: only comment complex code
    "COM812", # conflicts with formatter
    "ISC001", # conflicts with formatter
    "CPY001", # no copyright headers
    "PT",     # pytest style; tests use Django's unittest-based runner
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["PLR2004"]
"manage.py" = ["PLC0415", "TRY003", "EM101"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["django.db.models.Model", "rest_framework.serializers.Serializer"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool", "explicit-override"]
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["/migrations/"]

[[tool.mypy.overrides]]
module = ["factory.*", "corsheaders.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "server.settings"
strict_settings = true

[tool.coverage.run]
branch = true
source = ["fleet", "server"]
omit = ["*/migrations/*", "*/tests/*", "server/wsgi.py", "server/asgi.py"]

[tool.coverage.report]
exclude_also = ["def __str__"]
fail_under = 90
show_missing = true
skip_covered = true
