pre-commit:
  commands:
    ruff-format:
      root: backend/
      glob: "*.py"
      run: .venv/bin/ruff format {staged_files}
      stage_fixed: true
    ruff-check:
      root: backend/
      glob: "*.py"
      run: .venv/bin/ruff check --fix {staged_files}
      stage_fixed: true
    frontend-format:
      root: frontend/
      glob: "*.{ts,tsx,js,mjs,json,css}"
      run: npx prettier --write {staged_files}
      stage_fixed: true
    frontend-lint:
      root: frontend/
      glob: "*.{ts,tsx}"
      run: npx eslint {staged_files}

pre-push:
  parallel: true
  commands:
    mypy:
      root: backend/
      run: .venv/bin/mypy .
    test:
      root: backend/
      run: .venv/bin/python -W error -m coverage run manage.py test && .venv/bin/coverage report
    frontend-typecheck:
      root: frontend/
      run: npm run -s typecheck

commit-msg:
  commands:
    conventional:
      run: |
        msg=$(grep -v '^#' {1} | sed '/^$/d')
        if [ "$(printf '%s\n' "$msg" | wc -l)" -ne 1 ]; then
          echo "Commit message must be exactly one line"; exit 1
        fi
        printf '%s' "$msg" | grep -Eq '^(feat|fix|chore|docs|style|refactor|perf|test|build|ci|revert)(\([a-z0-9-]+\))?!?: .+' \
          || { echo "Commit message must follow Conventional Commits"; exit 1; }
